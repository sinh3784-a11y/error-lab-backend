services:
  postgres:
    image: postgres:17
    container_name: error_lab_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: sinh
      POSTGRES_PASSWORD: sinh
      POSTGRES_DB: error_lab_db

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinh -d error_lab_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: